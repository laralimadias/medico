<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItabunaMed - Painel do Paciente</title>
    <link rel="stylesheet" href="./estilo.css">
    <style>
        /* Estilos específicos para a estrutura do Painel */
        .painel-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .painel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .user-info h2 {
            color: #0f172a;
            font-size: 24px;
        }

        .user-info p {
            color: #64748b;
            font-size: 14px;
        }

        .btn-logout {
            background-color: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        /* Grid de Ações e Consultas */
        .painel-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .painel-grid {
                grid-template-columns: 1fr;
            }
        }

        .card-painel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
        }

        .card-painel h3 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Lista de Consultas */
        .lista-consultas {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-consulta {
            border-left: 4px solid #0284c7;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-consulta.pendente {
            border-left-color: #f59e0b;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .status-badge.confirmado {
            background: #dcfce7;
            color: #15803d;
        }

        .status-badge.analise {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>

    <div class="painel-container">
        
        <!-- Cabeçalho do Painel -->
        <header class="painel-header">
            <div class="user-info">
                <h2>Olá, Paciente</h2>
                <p>Bem-vindo ao seu portal de saúde ItabunaMed</p>
            </div>
            <a href="./index.html" class="btn-logout">Sair do Sistema</a>
        </header>

        <!-- Conteúdo Principal -->
        <div class="painel-grid">
            
            <!-- Coluna 1: Solicitar Nova Consulta -->
            <section class="card-painel">
                <h3>📅 Novo Agendamento</h3>
                <form action="./agendar.html">
                    <div>
                        <label for="especialidade">Especialidade Médica</label>
                        <select id="especialidade" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; margin-bottom: 16px;">
                            <option value="clinico">Clínico Geral</option>
                            <option value="pediatria">Pediatria</option>
                            <option value="ginecologia">Ginecologia</option>
                            <option value="odontologia">Odontologia</option>
                        </select>
                    </div>

                    <div>
                        <label for="data-sugerida">Data Preferencial</label>
                        <input type="date" id="data-sugerida" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; margin-bottom: 20px;" required>
                    </div>

                    <button type="submit" class="btn-primary">Solicitar Vaga</button>
                </form>
            </section>

            <!-- Coluna 2: Minhas Consultas Acompanhamento -->
            <section class="card-painel">
                <h3>📋 Minhas Solicitações e Consultas</h3>
                
                <div class="lista-consultas">
                    <!-- Exemplo de Consulta Confirmada -->
                    <div class="item-consulta">
                        <div>
                            <strong style="display: block; color: #0f172a;">Clínico Geral</strong>
                            <span style="font-size: 14px; color: #64748b;">UBS Dr. Adeum Sauer • 14/06/2026 às 08:30</span>
                        </div>
                        <span class="status-badge confirmado">Confirmado</span>
                    </div>

                    <!-- Exemplo de Consulta em Análise -->
                    <div class="item-consulta pendente">
                        <div>
                            <strong style="display: block; color: #0f172a;">Odontologia</strong>
                            <span style="font-size: 14px; color: #64748b;">Aguardando liberação de vaga no sistema</span>
                        </div>
                        <span class="status-badge analise">Em Análise</span>
                    </div>
                </div>
            </section>

        </div>

    </div>

</body>
</html>
