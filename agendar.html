<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItabunaMed - Agendar Consulta</title>
    <link rel="stylesheet" href="./estilo.css">
    <style>
        /* Estilos específicos para a tela de marcação de consultas */
        .agendamento-box {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .agendamento-box h2 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .agendamento-box .subtitulo {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* Estilização para os campos de seleção (Select) */
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            appearance: none; /* Remove a seta padrão do navegador */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
        }

        select:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        /* Estilização do campo de data */
        input[type="date"] {
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .botoes-container {
            display: flex;
            gap: 16px;
            margin-top: 28px;
        }

        .btn-voltar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40%;
            background-color: #f1f5f9;
            color: #334155;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="agendamento-box">
        <h2>📅 Solicitar Consulta Médica</h2>
        <p class="subtitulo">Preencha os campos abaixo para buscar uma vaga no sistema</p>

        <form action="./confirmacao.html">
            
            <div class="form-group">
                <label for="especialidade">Especialidade Médica</label>
                <select id="especialidade" required>
                    <option value="" disabled selected>Selecione a especialidade</option>
                    <option value="clinico">Clínico Geral</option>
                    <option value="pediatria">Pediatria</option>
                    <option value="ginecologia">Ginecologia</option>
                    <option value="odontologia">Odontologia</option>
                    <option value="cardiologia">Cardiologia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="local">Unidade de Saúde (UBS)</label>
                <select id="local" required>
                    <option value="" disabled selected>Selecione o posto de saúde</option>
                    <option value="ubs-sauer">UBS Dr. Adeum Sauer (E.T.I.)</option>
                    <option value="ubs-centro">UBS Centro Central</option>
                    <option value="ubs-california">UBS Califórnia</option>
                    <option value="ubs-santo-antonio">UBS Santo Antônio</option>
                </select>
            </div>

            <div class="form-group">
                <label for="data-consulta">Data Preferencial para Atendimento</label>
                <input type="date" id="data-consulta" required>
            </div>

            <div class="form-group">
                <label for="turno">Turno Preferencial</label>
                <select id="turno" required>
                    <option value="manha">Manhã (07:00 às 12:00)</option>
                    <option value="tarde">Tarde (13:00 às 17:00)</option>
                </select>
            </div>

            <div class="botoes-container">
                <a href="./painel.html" class="btn-voltar">Cancelar</a>
                <button type="submit" class="btn-primary" style="width: 60%;">Confirmar Agendamento</button>
            </div>

        </form>
    </div>

</body>
</html>
